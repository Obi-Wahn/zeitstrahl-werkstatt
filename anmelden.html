<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anmelden · Zeitstrahl-Werkstatt</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login">
<main class="login-card">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 34 22" aria-hidden="true">
      <path d="M2 16h30" class="bm-axis"/>
      <path d="M7 13v6M17 13v6M27 13v6" class="bm-tick"/>
      <path d="M12 16V4" class="bm-pole"/>
      <rect x="12" y="3" width="15" height="7" rx="1.5" class="bm-flag"/>
      <circle cx="12" cy="16" r="2.6" class="bm-dot"/>
    </svg>
    <span class="brand-name">Zeitstrahl-Werkstatt</span>
  </div>
  <h1>Lehrkraft-Ansicht</h1>
  <p class="login-lead">Das Passwort hast du am Laptop unter <strong>Datei → Am Lehrer-PC öffnen</strong> festgelegt.</p>
  <!--hinweis-->
  <form method="post" action="/lehrkraft" class="login-form">
    <div class="field">
      <label for="passwort">Passwort</label>
      <input id="passwort" name="passwort" type="password" autocomplete="current-password" required autofocus>
    </div>
    <button type="submit" class="btn primary">Anmelden</button>
  </form>
  <p class="login-note">Schülerinnen und Schüler: <a href="/beitrag.html">zur Schülerseite</a></p>
</main>
</body>
</html>
